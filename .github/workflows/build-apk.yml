name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Unzip project
        run: |
          unzip -o ClockWidgets.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 2 -type f | head -50

      - name: Build debug APK
        working-directory: extracted/ClockWidgets
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clock-widgets-debug-apk
          path: extracted/ClockWidgets/app/build/outputs/apk/debug/*.apk
