name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Find project ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found. Upload ClockWidgets.zip to the repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_path=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.find_zip.outputs.zip_path }}" -d extracted
          find extracted -maxdepth 3 -type f | head -50

      - name: Detect Android project
        id: detect_project
        run: |
          APP_GRADLE=$(find extracted -type f -path "*/app/build.gradle.kts" | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::app/build.gradle.kts was not found after extraction."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clock-widgets-debug-apk
          path: ${{ steps.detect_project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
